name: CI

on:
  push:
    branches: [main, development, production]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # `next build` imports src/lib/prisma.ts, which validates the environment
      # on load. No query runs during the build, so a syntactically valid
      # placeholder is enough — CI never reaches a real database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Runs `prisma generate` via postinstall; the generated client is
      # gitignored, so nothing downstream typechecks without this.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
